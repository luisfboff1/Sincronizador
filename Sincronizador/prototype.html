  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; background: #F8F9FA; color: #182028; }
    .font-heading { font-family: 'Bai Jamjuree', sans-serif; }

    /* ─── Subtle Grid Background (white-medical inspired) ─── */
    .bg-grid {
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ─── Glass Card (cool-dashboard inspired) ─── */
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #E5E5E6;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(24,32,40,0.05);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      box-shadow: 0 8px 40px rgba(24,32,40,0.09);
      border-color: #C5C4C6;
    }

    /* ─── Gradient Border Card (cool-dashboard mask technique) ─── */
    .gradient-border { position: relative; }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(238,70,35,0.18), rgba(238,70,35,0));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ─── Animations (gemini2 + white-medical inspired) ─── */
    @keyframes reveal-up {
      0%   { clip-path: inset(100% 0 0 0); transform: translateY(18px); opacity: 0; }
      100% { clip-path: inset(0 0 0 0); transform: translateY(0); opacity: 1; }
    }
    @keyframes slide-up {
      0%   { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes fade-in {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes pulse-brand {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @keyframes glow-brand {
      0%, 100% { box-shadow: 0 0 8px rgba(238,70,35,0.25); }
      50% { box-shadow: 0 0 24px rgba(238,70,35,0.5); }
    }
    @keyframes flow-particle {
      0%   { left: -12px; opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { left: calc(100% + 12px); opacity: 0; }
    }

    /* Reveal cascade for tab content children */
    .tab-reveal > * {
      opacity: 0;
      animation: reveal-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tab-reveal > *:nth-child(1) { animation-delay: 0s; }
    .tab-reveal > *:nth-child(2) { animation-delay: 0.08s; }
    .tab-reveal > *:nth-child(3) { animation-delay: 0.16s; }
    .tab-reveal > *:nth-child(4) { animation-delay: 0.24s; }
    .tab-reveal > *:nth-child(5) { animation-delay: 0.32s; }
    .tab-reveal > *:nth-child(6) { animation-delay: 0.40s; }

    /* Step indicators */
    .s-done   { background: #30373E; color: #F8F9FA; }
    .s-active { background: #EE4623; color: #fff; box-shadow: 0 0 0 4px rgba(238,70,35,0.18); }
    .s-wait   { background: #E5E5E6; color: #A0A1A3; }

    /* Tabs */
    .tab-on  { background: #EE4623; color: #fff; box-shadow: 0 2px 12px rgba(238,70,35,0.3); }
    .tab-off { color: #575A60; background: transparent; }
    .tab-off:hover { background: #FFF9F8; color: #EE4623; }

    /* Pipeline connector */
    .pipe-conn {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      min-width: 48px; height: 2px;
      background: linear-gradient(90deg, #DBDDDE, #C5C4C6, #DBDDDE);
    }
    .pipe-conn::after {
      content: ''; position: absolute; right: -5px;
      width: 0; height: 0;
      border-left: 7px solid #C5C4C6;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }
    .pipe-conn .flow-dot {
      position: absolute; top: -1px; width: 16px; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #EE4623, transparent);
      animation: flow-particle 2.2s linear infinite;
    }

    /* Corrida chip */
    .corrida-chip {
      font-family: 'Bai Jamjuree', sans-serif;
      font-weight: 700; font-size: 13px;
      padding: 8px 14px; border-radius: 14px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer; text-align: center;
    }
    .corrida-chip:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }

    /* Note Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(24,32,40,0.35); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      animation: fade-in 0.2s ease;
    }
    .modal-card {
      background: #fff; border-radius: 20px; padding: 28px;
      min-width: 380px; max-width: 480px; width: 90%;
      box-shadow: 0 24px 64px rgba(24,32,40,0.18);
      animation: reveal-up 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .modal-card textarea {
      width: 100%; min-height: 100px; border-radius: 12px; padding: 12px;
      border: 1.5px solid #E5E5E6; font-family: Inter, sans-serif; font-size: 13px;
      color: #182028; resize: vertical; outline: none; transition: border 0.2s;
    }
    .modal-card textarea:focus { border-color: #EE4623; }
    .modal-card textarea::placeholder { color: #A0A1A3; }

    /* Pipeline slot */
    .pipe-slot {
      min-width: 106px; min-height: 48px;
      border: 2px dashed #DBDDDE; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.35s ease;
    }
    .pipe-slot.filled { border-style: solid; border-color: transparent; }

    /* Timing table */
    .t-row { transition: background 0.2s ease; }
    .t-row:hover { background: #FFF9F8; }

    /* Scrollbar */
    .sb::-webkit-scrollbar { width: 5px; height: 5px; }
    .sb::-webkit-scrollbar-thumb { background: #C5C4C6; border-radius: 3px; }
    .sb::-webkit-scrollbar-track { background: transparent; }

    /* Countdown text glow */
    .cd-glow { text-shadow: 0 0 24px rgba(238,70,35,0.35); }

    /* InfoTooltip */
    .info-tip { position: relative; display: inline-flex; }
    .info-tip-btn {
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; font-style: italic; font-family: 'Bai Jamjuree', serif;
      color: #A0A1A3; background: #F8F9FA; border: 1.5px solid #E5E5E6;
      cursor: pointer; transition: all 0.25s ease; user-select: none;
    }
    .info-tip-btn:hover { color: #EE4623; border-color: #EE4623; background: #FFF9F8; }
    .info-tip-pop {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      min-width: 220px; padding: 12px 14px; border-radius: 14px;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
      border: 1px solid #E5E5E6; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      z-index: 100; animation: reveal-up 0.25s cubic-bezier(0.16,1,0.3,1);
    }
    .info-tip-pop::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 6px solid #E5E5E6;
    }
  </style>

      const ws=['PANELA_CHEGOU','TARA','VAZ_INÍCIO','PLATO','PANELA_SAIU','TARA_RESET'];
      const d=MOCK.feaT, av=a=>(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1);
      const cols=['Corrida','Aquec. (min)','Pausas','Vazamento (min)','Total (min)'];
      const rows=d.map(r=>[r.id,r.aq,r.pa,r.vz,r.tt]);
      const avgR=['Média (5)',av(d.map(r=>r.aq)),av(d.map(r=>r.pa)),av(d.map(r=>r.vz)),av(d.map(r=>r.tt))];
      const pred=['Prev. 131512','~42','~3','~8','~53'];
      const feaAvgItems=[
        {label:'Aquecimento',value:av(d.map(r=>r.aq))+' min'},
        {label:'Pausas',value:av(d.map(r=>r.pa))},
        {label:'Vazamento',value:av(d.map(r=>r.vz))+' min'},
        {label:'Total',value:av(d.map(r=>r.tt))+' min'},
      ];
      return (
        <div className="tab-reveal space-y-5">
          <Card accent>
            <div className="flex items-center gap-2">
              <Title icon="flame" badge={<Badge>131512 — HEATING</Badge>}>FEA — Micro Etapas (3 Caminhos Paralelos)</Title>
              <InfoTooltip items={feaAvgItems}/>
            </div>
            <Steps steps={es} cur={2} label="⚡ Energia"/>
            <Steps steps={is_} cur={-1} label="📐 Inclinação"/>
            <Steps steps={ws} cur={0} label="⚖️ Peso Panela"/>
          </Card>
          <Card>
            <Title>Tempos por Etapa — Últimas 5 Corridas</Title>
            <TTable cols={cols} rows={rows} avg={avgR} pred={pred}/>
          </Card>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <Card><Title>Energia Acumulada (kWh)</Title><Crt cfg={lineGfx(MOCK.cFEAe,'Energia',C.brand,true)}/></Card>
            <Card><Title>Ângulo Inclinação (°)</Title><Crt cfg={lineGfx(MOCK.cFEAi,'Ângulo',C.b45)}/></Card>
            <Card><Title>Peso Carro Panela (t)</Title><Crt cfg={lineGfx(MOCK.cFEAw,'Peso',C.g700,true)}/></Card>
          </div>
        </div>
      );
    };

    /* ================================================================
       FP TAB
       ================================================================ */
    const FPTab = () => {
      const [car,setCar]=useState(1);
      const st=['CHEGADA','AQUECIMENTO','TRATAMENTO','VAZAMENTO','SAÍDA'];
      const d=MOCK.fpT, av=a=>(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1);
      const cols=['Corrida','Aquec. (min)','Tratamento (min)','Vazamento (min)','Total (min)'];
      const rows=d.map(r=>[r.id,r.aq,r.tr,r.vz,r.tt]);
      const avgR=['Média (5)',av(d.map(r=>r.aq)),av(d.map(r=>r.tr)),av(d.map(r=>r.vz)),av(d.map(r=>r.tt))];
      const pred=['Prev. 131511','~25','~18','~6','~49'];
      const fpAvgItems=[
        {label:'Aquecimento',value:av(d.map(r=>r.aq))+' min'},
        {label:'Tratamento',value:av(d.map(r=>r.tr))+' min'},
        {label:'Vazamento',value:av(d.map(r=>r.vz))+' min'},
        {label:'Total',value:av(d.map(r=>r.tt))+' min'},
      ];
      return (
        <div className="tab-reveal space-y-5">
          <Card accent>
            <div className="flex items-center gap-2">
              <Title icon="flame" badge={<Badge color={STAGE.FP.fg} bg={STAGE.FP.bg}>131511 — TRATAMENTO</Badge>}>
                FP — Forno Panela — Micro Etapas
              </Title>
              <InfoTooltip items={fpAvgItems}/>
            </div>
            <div className="flex gap-2 mb-4"><Pill on={car===1} onClick={()=>setCar(1)}>Carro 1</Pill><Pill on={car===2} onClick={()=>setCar(2)}>Carro 2</Pill></div>
            <Steps steps={st} cur={car===1?2:1}/>
            {car===2 && <div className="text-xs italic" style={{color:C.g500}}>Carro 2 — 131510 em AQUECIMENTO</div>}
          </Card>
          <Card>
            <Title>Tempos por Etapa — Últimas 5 (Carro {car})</Title>
            <TTable cols={cols} rows={rows} avg={avgR} pred={pred}/>
          </Card>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <Card><Title>Energia Acumulada (kWh)</Title><Crt cfg={lineGfx(MOCK.cFPe,'Energia',C.b45,true)}/></Card>
            <Card><Title>Temperatura (°C)</Title><Crt cfg={lineGfx(MOCK.cFPt,'Temp',C.brand)}/></Card>
          </div>
        </div>
      );
    };

    /* ================================================================
       VD TAB
       ================================================================ */
    const VDTab = () => {
      const [tk,setTk]=useState(1);
      const st=['VD_ARRIVAL','DEEP_VAC_START','DEEP_VAC_END','VD_EXIT'];
      const d=MOCK.vdT, av=a=>(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1);
      const cols=['Corrida','Deep Vac Start','Deep Vac End','Exit (min)'];
      const rows=d.map(r=>[r.id,r.st,r.en,r.ex]);
      const avgR=['Média (5)',av(d.map(r=>r.st)),av(d.map(r=>r.en)),av(d.map(r=>r.ex))];
      const pred=['Prev. 131509','~2','~18','~22'];
      const vdAvgItems=[
        {label:'Deep Vac Start',value:av(d.map(r=>r.st))+' min'},
        {label:'Deep Vac End',value:av(d.map(r=>r.en))+' min'},
        {label:'Exit',value:av(d.map(r=>r.ex))+' min'},
      ];
      return (
        <div className="tab-reveal space-y-5">
          <Card accent>
            <div className="flex items-center gap-2">
              <Title icon="zap" badge={<Badge color={STAGE.VD.fg} bg={STAGE.VD.bg}>131509 — DEEP_VAC</Badge>}>
                VD — Vácuo Desgaseificação — Micro Etapas
              </Title>
              <InfoTooltip items={vdAvgItems}/>
            </div>
            <div className="flex gap-2 mb-4"><Pill on={tk===1} onClick={()=>setTk(1)}>Tanque 1</Pill><Pill on={tk===2} onClick={()=>setTk(2)}>Tanque 2</Pill></div>
            <Steps steps={st} cur={tk===1?1:-1}/>
            {tk===2 && <div className="text-xs italic" style={{color:C.g500}}>Tanque 2 — Livre (sem corrida ativa)</div>}
          </Card>
          <Card>
            <Title>Tempos por Etapa — Últimas 5 (Tanque {tk})</Title>
            <TTable cols={cols} rows={rows} avg={avgR} pred={pred}/>
          </Card>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <Card><Title>Vazão (m³/min)</Title><Crt cfg={lineGfx(MOCK.cVDf,'Vazão',C.g700)}/></Card>
            <Card><Title>Volume Acumulado (m³)</Title><Crt cfg={lineGfx(MOCK.cVDv,'Volume',C.g600,true)}/></Card>
            <Card><Title>Pressão Vácuo (Pa)</Title><Crt cfg={lineGfx(MOCK.cVDp,'Pressão',C.g800)}/></Card>
          </div>
        </div>
      );
    };

    /* ================================================================
       LC TAB
       ================================================================ */
    const LCTab = () => {
      const [arm,setArm]=useState(1);
      const st=['CHEGADA_TORRE','INÍCIO_LC','PESO_REAL','VAZAMENTO','FIM_PESO_REAL','FINAL_LC'];
      const d=MOCK.lcT, av=a=>(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1);
      const cols=['Corrida','Início','Peso Real','Vazamento','Fim Peso','Final (min)'];
      const rows=d.map(r=>[r.id,r.in_,r.pe,r.vz,r.fp,r.fn]);
      const avgR=['Média (5)',av(d.map(r=>r.in_)),av(d.map(r=>r.pe)),av(d.map(r=>r.vz)),av(d.map(r=>r.fp)),av(d.map(r=>r.fn))];
      const pred=['Prev. 131508','~3','~5','~32','~38','~40'];
      /* LC countdown (inline big version) */
      const [t,setT]=useState(MOCK.lcd.min*60+MOCK.lcd.sec);
      useEffect(()=>{ const id=setInterval(()=>setT(v=>Math.max(0,v-1)),1000); return()=>clearInterval(id); },[]);
      const m=Math.floor(t/60),s=t%60,urg=m<5;
      const lcAvgItems=[
        {label:'Início',value:av(d.map(r=>r.in_))+' min'},
        {label:'Peso Real',value:av(d.map(r=>r.pe))+' min'},
        {label:'Vazamento',value:av(d.map(r=>r.vz))+' min'},
        {label:'Fim Peso',value:av(d.map(r=>r.fp))+' min'},
        {label:'Final',value:av(d.map(r=>r.fn))+' min'},
      ];
      return (
        <div className="tab-reveal space-y-5">
          {/* Prominent Countdown */}
          <Card accent className="text-center overflow-hidden">
            <div className="py-5">
              <div className="text-[10px] font-bold uppercase tracking-[0.14em] mb-2" style={{color:C.g500}}>
                Cronômetro LC — Corrida {MOCK.lcd.id} — Braço {arm}
              </div>
              <div className={`font-heading font-black text-6xl sm:text-7xl tabular-nums tracking-tighter ${urg?'cd-glow':''}`}
                style={{color:urg?C.brand:C.g800,animation:urg?'pulse-brand 1.5s ease-in-out infinite':'none'}}>
                {String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}
              </div>
              <div className="text-xs mt-2" style={{color:C.g500}}>Tempo restante estimado para troca de panela</div>
              {/* Progress bar */}
              <div className="mx-auto mt-4 w-full max-w-md h-1.5 rounded-full overflow-hidden" style={{background:C.g200}}>
                <div className="h-full rounded-full transition-all duration-1000"
                  style={{width:`${Math.max(0,(1-t/(MOCK.lcd.min*60+MOCK.lcd.sec))*100)}%`,background:urg?C.brand:C.g700}}/>
              </div>
            </div>
          </Card>
          <Card accent>
            <div className="flex items-center gap-2">
              <Title icon="timer" badge={<Badge color={C.w} bg={C.g800}>131508 — VAZAMENTO</Badge>}>LC — Lingotamento Contínuo — Micro Etapas</Title>
              <InfoTooltip items={lcAvgItems}/>
            </div>
            <div className="flex gap-2 mb-4"><Pill on={arm===1} onClick={()=>setArm(1)}>Braço 1</Pill><Pill on={arm===2} onClick={()=>setArm(2)}>Braço 2</Pill></div>
            <Steps steps={st} cur={arm===1?3:-1}/>
            {arm===2 && <div className="text-xs italic" style={{color:C.g500}}>Braço 2 — Livre (aguardando próxima panela)</div>}
          </Card>
          <Card>
            <Title>Tempos por Etapa — Últimas 5 (Braço {arm})</Title>
            <TTable cols={cols} rows={rows} avg={avgR} pred={pred}/>
          </Card>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <Card><Title>Peso Braço (t)</Title><Crt cfg={lineGfx(MOCK.cLCa,'Peso',C.g700)}/></Card>
            <Card><Title>Peso Real Torre (t)</Title><Crt cfg={lineGfx(MOCK.cLCr,'Peso',C.b90,true)}/></Card>
            <Card>
              <Title>Velocidade dos Veios (m/min)</Title>
              <Crt cfg={multiLine([
                {l:'Veio 1',d:MOCK.cLCv1.map(d=>d.y),c:C.brand},
                {l:'Veio 2',d:MOCK.cLCv2.map(d=>d.y),c:C.g600},
                {l:'Veio 3',d:MOCK.cLCv3.map(d=>d.y),c:C.b45},
              ],MOCK.cLCv1.map(d=>d.x))}/>
            </Card>
          </div>
        </div>
      );
    };

    /* ================================================================
       APP
       ================================================================ */
    const App = () => {
      const [tab,setTab]=useState('geral');
      const [k,setK]=useState(0);
      const [noteTarget,setNoteTarget]=useState(null);
      const [notes,setNotes]=useState({});
      const saveNote=(id,txt)=>setNotes(n=>({...n,[id]:txt}));
      const go = id => { setTab(id); setK(n=>n+1); };
      const tabs={
        geral:()=><GeralTab onNote={c=>setNoteTarget(c)}/>,
        fea:FEATab, fp:FPTab, vd:VDTab, lc:LCTab,
      };
      const T=tabs[tab];
      return (
        <div className="min-h-screen font-body">
          <Header/>
          <TabNav cur={tab} set={go}/>
          <main className="max-w-[1440px] mx-auto px-6 py-6" key={k}><T/></main>
          <footer className="text-center py-5 text-[10px] font-medium tracking-wider"
            style={{color:C.g400,borderTop:`1px solid ${C.g200}`,background:C.w}}>
            Sincronizador v0.3 — Protótipo — © Evcomx {new Date().getFullYear()}
          </footer>
          {noteTarget && <NoteModal corrida={noteTarget} notes={notes} onSave={saveNote} onClose={()=>setNoteTarget(null)}/>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
